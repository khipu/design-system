buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://repo.grails.org/grails/core' }
    }
    dependencies {
        classpath "org.grails:grails-gradle-plugin:$grailsGradlePluginVersion"
    }
}

apply plugin: 'org.grails.grails-plugin'
apply plugin: 'org.grails.grails-gsp'
apply plugin: 'maven-publish'

group = 'com.khipu'
version = project.property('version')

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://repo.grails.org/grails/core' }
}

configurations.configureEach {
    exclude group: 'commons-logging', module: 'commons-logging'
}

// asset-pipeline (payment's build) scans every jar on the runtime classpath for a
// META-INF/assets/ folder and serves whatever it finds, no extra config on the
// producer side. Bundling the already-built BeerCSS output here means the Gradle
// dependency is the only thing a consuming app needs to add for both the taglibs
// and their CSS/JS to show up — no separate CDN link, no separate version to track.
def beercssDist = file("${projectDir}/../../dist/beercss")

task copyDesignSystemAssets(type: Copy) {
    description = 'Copies the built BeerCSS bundle into META-INF/assets for asset-pipeline consumers'
    onlyIf {
        if (!beercssDist.exists()) {
            throw new GradleException("${beercssDist} is missing — run 'npm run build' at the repo root first")
        }
        true
    }
    from(beercssDist) {
        include 'khipu-beercss.min.css'
        rename { 'khipu-beercss.css' }
        into 'META-INF/assets/stylesheets'
    }
    from(beercssDist) {
        include 'khipu-beercss.min.js'
        rename { 'khipu-beercss.js' }
        into 'META-INF/assets/javascripts'
    }
    into "${buildDir}/generated-resources"
}

sourceSets {
    main {
        resources {
            srcDir "${buildDir}/generated-resources"
        }
    }
}

processResources.dependsOn(copyDesignSystemAssets)

dependencies {
    profile 'org.grails.profiles:web-plugin'

    implementation "org.grails:grails-core:$grailsVersion"
    implementation "org.grails:grails-web-boot:$grailsVersion"
    implementation "org.grails:grails-plugin-url-mappings:$grailsVersion"
    implementation "org.grails:grails-plugin-interceptors:$grailsVersion"
    implementation "org.grails:grails-logging:$grailsVersion"

    testImplementation 'org.grails:grails-gorm-testing-support:3.2.2'
    testImplementation 'org.grails:grails-web-testing-support:3.2.2'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.khipu'
            artifactId = 'design-system-grails-taglibs'
            version = project.version
            from components.java
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = 'khipuNexus'
            url = 'https://dev.khipu.com/nexus/content/repositories/design-system'
            credentials {
                username = project.findProperty('khipuRepoUsername') ?: ''
                password = project.findProperty('khipuRepoPassword') ?: ''
            }
        }
    }
}
