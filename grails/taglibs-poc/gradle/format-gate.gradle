// ============================================================================
// Formatting gate — Gradle entry points over scripts/check-format.py
// ----------------------------------------------------------------------------
//   installGitHooks  points core.hooksPath at the versioned .githooks/, so the
//                    pre-commit hook reaches a clone without anyone installing
//                    it. Runs off compileGroovy and bootRun.
//   checkFormat      judges the lines the branch adds over a base ref. What the
//                    pull-requests pipeline step runs.
//
// Both delegate to the script rather than reimplementing it: the hook runs on
// every commit, and a Gradle task costs seconds against the script's tens of
// milliseconds, which is the difference between a gate that is tolerated and
// one that gets bypassed. See docs/CONVENTIONS.md §13.
// ============================================================================

ext.formatChecker = "${rootDir}/scripts/check-format.py"

// Either variable means CI, where there is no local clone whose hooks matter.
ext.runningInCi = { System.getenv('CI') || System.getenv('BITBUCKET_BUILD_NUMBER') }

// Asked for by name rather than pulled in by compileGroovy: the difference between
// a build step that should stay quiet and someone asking about the hooks.
ext.askedForDirectly = { String name ->
    gradle.startParameter.taskNames.any { it == name || it.endsWith(":${name}") }
}

// `git config --get core.hooksPath` only proves the wiring. The hook still goes
// quiet if it lost its executable bit or if python3 is missing, and both failures
// look exactly like a passing commit, so all three are reported together.
ext.reportGateStatus = { String hooksPath ->
    File hook = file("${rootDir}/${hooksPath}/pre-commit")
    boolean executable = hook.exists() && hook.canExecute()
    boolean python = false
    try {
        python = exec {
            commandLine 'python3', '--version'
            standardOutput = new ByteArrayOutputStream()
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }.exitValue == 0
    } catch (Exception ignored) {
        python = false
    }

    logger.lifecycle("  core.hooksPath   ${hooksPath}")
    logger.lifecycle("  hook executable  ${executable ? 'yes' : 'NO'}")
    logger.lifecycle("  python3          ${python ? 'found' : 'NOT FOUND'}")
    if (executable && python) {
        logger.lifecycle('  the format gate is active on this clone')
    } else if (!executable) {
        logger.lifecycle("  the gate is INACTIVE: run chmod +x ${hooksPath}/pre-commit")
    } else {
        logger.lifecycle('  the gate is INACTIVE: install python3 and it starts working')
    }
    executable && python
}

tasks.register('installGitHooks') {
    group = 'verification'
    description = 'Points git at the versioned .githooks/ so the pre-commit format gate runs'

    // A sub-second git config read that must notice a hooksPath changed by hand.
    outputs.upToDateWhen { false }

    doLast {
        if (runningInCi()) {
            return
        }
        if (!file("${rootDir}/.git").exists()) {
            // A tarball or an exported tree has no hooks to install. Not a failure.
            return
        }
        String desired = '.githooks'
        String current = ''
        try {
            ByteArrayOutputStream captured = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'config', '--get', 'core.hooksPath'
                standardOutput = captured
                errorOutput = new ByteArrayOutputStream()
                // git exits 1 when the key is unset, which is the common first-run case.
                ignoreExitValue = true
            }
            current = captured.toString().trim()
        } catch (Exception exception) {
            logger.info("installGitHooks: could not read core.hooksPath (${exception.message})")
            return
        }

        if (current == desired) {
            if (askedForDirectly('installGitHooks')) {
                reportGateStatus(desired)
            } else {
                // Silent on purpose: this runs on every compile.
                logger.info("installGitHooks: core.hooksPath already points at ${desired}")
            }
            return
        }

        if (current && current != desired) {
            logger.lifecycle("installGitHooks: core.hooksPath is '${current}', leaving it alone")
            logger.lifecycle("  run `git config core.hooksPath ${desired}` to enable the format gate")
            return
        }

        try {
            exec {
                commandLine 'git', 'config', 'core.hooksPath', desired
            }
            logger.lifecycle("installGitHooks: hooks installed (core.hooksPath -> ${desired})")
            reportGateStatus(desired)
            logger.lifecycle('  rules: docs/CONVENTIONS.md §13')
        } catch (Exception exception) {
            // A broken hook install must never be the reason a build fails.
            logger.lifecycle("installGitHooks: could not set core.hooksPath (${exception.message})")
        }
    }
}

tasks.register('verifyGitHooks') {
    group = 'verification'
    description = 'Reports whether the pre-commit format gate is active, without installing it'

    outputs.upToDateWhen { false }

    doLast {
        String hooksPath = ''
        try {
            ByteArrayOutputStream captured = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'config', '--get', 'core.hooksPath'
                standardOutput = captured
                errorOutput = new ByteArrayOutputStream()
                ignoreExitValue = true
            }
            hooksPath = captured.toString().trim()
        } catch (Exception ignored) {
            hooksPath = ''
        }

        if (hooksPath != '.githooks') {
            logger.lifecycle("  core.hooksPath   ${hooksPath ?: '(unset)'}")
            logger.lifecycle('  the format gate is NOT installed on this clone')
            logger.lifecycle('  install it with: ./gradlew installGitHooks')
            throw new GradleException('verifyGitHooks: the format gate is not installed')
        }
        if (!reportGateStatus(hooksPath)) {
            throw new GradleException('verifyGitHooks: the format gate is installed but inactive')
        }
    }
}

tasks.register('checkFormat') {
    group = 'verification'
    description = 'Checks the indentation of the lines this branch adds over -PformatBase'

    outputs.upToDateWhen { false }

    doLast {
        // The fork point, not the whole tree: files carrying older whitespace debt
        // would otherwise fail a branch that never touched them. Override for a
        // branch cut from elsewhere: ./gradlew checkFormat -PformatBase=origin/prod
        String base = (project.findProperty('formatBase') ?: 'origin/master').toString()
        ExecResult result = exec {
            commandLine 'python3', formatChecker, '--against', base
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            throw new GradleException(
                    "checkFormat: formatting violations against ${base} (see the list above)")
        }
    }
}

tasks.matching { it.name in ['compileGroovy', 'bootRun'] }.configureEach {
    dependsOn 'installGitHooks'
}

tasks.matching { it.name == 'check' }.configureEach {
    dependsOn 'checkFormat'
}
