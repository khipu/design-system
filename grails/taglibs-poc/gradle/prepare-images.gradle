// ============================================================================
// Per-image source-tree pruning — Gradle tasks (Story 5.19.1 / NG-421)
// ----------------------------------------------------------------------------
// Replaces the 6 Grails-2 Gant scripts (scripts/Prepare*Version.groovy) + their
// shared scripts/_Cleaners.groovy, which used the Gant API (includeTargets /
// target / depends) that does NOT exist in Grails 6. Pattern adopted from
// ~/git/cerebro/src/main/scripts/*.groovy: imperative Groovy pruning, run
// BEFORE `./gradlew assemble`, here repackaged as first-class Gradle tasks
// (payment is Gradle-only — no grailsw).
//
// Each task MUTATES THE WORKING TREE IN PLACE (deletes files). The pipeline
// (Story 5.19.2) runs them on a fresh clone per parallel image step; locally,
// verify on a commit savepoint and `git reset --hard` afterwards (see the
// story's boot-standalone loop).
//
// The 8 distinct images: api, http, consumers, payment-index-consumers, jobs,
// metadata-consumers-{0,1,2}. The 3 metadata images are SHARDS (different
// HandleMetadata${index}Consumer classes), not replicas.
//
// Invocation (mirrors the legacy command names):
//   ./gradlew prepareApiVersion
//   ./gradlew prepareHttpVersion
//   ./gradlew prepareConsumersVersion
//   ./gradlew prepareIndexConsumerVersion
//   ./gradlew prepareJobsVersion
//   ./gradlew prepareMetadataConsumersVersion -Pfirst=0 -Pconsumers=10 -PmaxMetadataConsumers=30
// ============================================================================

ext.PAYMENT_PKG          = 'com/khipu/payment'
ext.CONSUMERS_DIR        = "grails-app/rabbit-consumers/${PAYMENT_PKG}/"
ext.JOBS_DIR             = "grails-app/jobs/${PAYMENT_PKG}/"
ext.CONTROLLERS_PKG_ROOT = 'grails-app/controllers/com/'
ext.APPLICATION_GROOVY   = 'grails-app/conf/application.groovy'
ext.APPLICATION_YML      = 'grails-app/conf/application.yml'
ext.METADATA_TMPL        = 'scripts/templates/HandleMetadataConsumer.groovy.tmpl'
ext.METADATA_TMPL_DEFAULT= 'scripts/templates/HandleMetadataConsumerDefault.groovy.tmpl'

// ---------------------------------------------------------------------------
// Generic filesystem helpers (ported from scripts/_Cleaners.groovy)
// ---------------------------------------------------------------------------
def removeDirectory(String dirPath) {
    println "Removing directory: ${dirPath}"
    new File(dirPath).deleteDir()
}

def removeFile(String filePath) {
    println "Removing file: ${filePath}"
    new File(filePath).delete()
}

def overwriteFile(String filePath, String content) {
    println "Overwriting file: ${filePath}"
    // project.file() resolves against the project root (deterministic); a bare
    // new File(relativePath).parentFile.mkdirs() does not reliably create the
    // parent when the dir was just deleted, causing FileNotFoundException on write.
    File target = project.file(filePath)
    target.parentFile.mkdirs()
    target.text = content
}

// Remove every *.groovy in `dir` whose basename does NOT match an entry in
// `whiteList` (each entry is a basename-without-extension regex).
def removeFilesInFolder(String dir, List<String> whiteList) {
    println "Removing all files from ${dir}, except ${whiteList}"
    new File(dir)
            ?.listFiles()
            ?.sort()
            ?.findAll { File f -> !f.isDirectory() && !whiteList.any { f.name.matches("${it}\\.groovy") } }
            ?.each { File f -> println "\tRemoving file: ${f}"; f.delete() }
}

// Walk `baseDir` for *Controller.groovy and delete those NOT matching keepRegex.
def regexRemoveFile(String baseDir, java.util.regex.Pattern keepRegex) {
    File root = new File(baseDir)
    if (!root.exists()) { println "[regexRemoveFile] Base dir not found: ${root}"; return }
    root.eachFileRecurse { File f ->
        if (f.isFile() && f.name.endsWith('Controller.groovy')) {
            if (!keepRegex.matcher(f.name).matches()) {
                f.delete(); println "\t[regexRemoveFile] Deleted: ${f}"
            } else {
                println "\t[regexRemoveFile] Kept: ${f}"
            }
        }
    }
}

// ---------------------------------------------------------------------------
// Dependency pruning — edits build.gradle (Grails 6: deps live here, NOT the
// removed BuildConfig.groovy). BRACE-AWARE: removes a dependency declaration
// including an optional trailing `{ exclude ... }` block, so multi-line blocks
// (quartz, rabbitmq-native) don't leave orphaned braces.
//
// IMPORTANT (Story 5.19.1 principle, corrected 2026-06-02..03): rabbit
// (rabbitmq-native + amqp-client) is RETAINED in every image that publishes or
// consumes — api and http PUBLISH, so they keep rabbit. quartz is pruned ONLY
// from the metadata-consumers shards (they remove ALL jobs); api / http /
// consumers / index / jobs all retain the cron-triggered ResendFailedMessagesJob
// (verified in the boot-test loop) which the quartz plugin schedules, so they
// keep quartz. (This matches the legacy Prepare*Version dep lists — the "prune
// quartz everywhere but jobs" idea was rejected after the job analysis.)
//
// TODO-PRUNE-REVIEW: when these deps return, prune them from images that don't
// use them:
//   - asset-pipeline  → web assets; keep only in images WITH web (http, api).
//   - web events / SSE (Epic 11 atmosphere replacement) → keep only in web
//     images that push events to the browser.
// The legacy lists also pruned ':atmosphere-meteor:', ':jquery:',
// ':asset-pipeline:' — none are present in build.gradle today (inert), kept
// here as documented intent so a future contributor re-evaluates on reintro.
// ---------------------------------------------------------------------------
def removeDependency(String coordinateFragment) {
    File buildFile = new File('build.gradle')
    List<String> lines = buildFile.text.readLines()
    List<String> out = []
    boolean removedAny = false
    int i = 0
    while (i < lines.size()) {
        String line = lines[i]
        String trimmed = line.trim()
        boolean isDeclaration = ['implementation', 'runtimeOnly', 'compileOnly', 'api ', 'profile', 'testImplementation']
                .any { trimmed.startsWith(it) }
        if (isDeclaration && line.contains(coordinateFragment)) {
            println "\t[removeDependency] Removing declaration matching '${coordinateFragment}': ${trimmed}"
            int balance = line.count('{') - line.count('}')
            i++
            while (balance > 0 && i < lines.size()) {
                balance += lines[i].count('{') - lines[i].count('}')
                i++
            }
            removedAny = true
            continue
        }
        out << line
        i++
    }
    if (!removedAny) {
        println "\t[removeDependency] No declaration matched '${coordinateFragment}' (inert — dep not present)."
    }
    buildFile.text = out.join('\n') + '\n'
}

def removeDependencies(List<String> coordinateFragments) {
    println "Removing dependencies: ${coordinateFragments}"
    coordinateFragments.each { removeDependency(it) }
}

// ---------------------------------------------------------------------------
// Web layer
// ---------------------------------------------------------------------------
// Full web strip (consumers / index / jobs / metadata). Does NOT write a
// healthcheck — the caller decides (consumer images write the startConsumers
// healthcheck; jobs writes empty mappings).
def stripWebLayer() {
    removeDirectory CONTROLLERS_PKG_ROOT
    removeDirectory 'grails-app/atmosphere/'
    removeFile 'grails-app/conf/AtmosphereMeteorConfig.groovy'
    removeDirectory 'grails-app/assets/'
    removeDirectory 'grails-app/views/'
}

// The status-code handlers at the tail of UrlMappings.groovy ("400"/"403"/"404"/
// "405"/"500") forward to GSPs under grails-app/views/, which removeNonApiWebFiles()
// deletes. Left in place they do NOT change the status code — a 404 still answers 404 —
// but each one logs two stacktraces and returns Tomcat's HTML error page instead of
// JSON (boot-test 2026-08-18: ~200 log lines per single 404):
//   Could not resolve view with name '/notfound'
//   Exception Processing ErrorPage[errorCode=404, location=/error]
// Both lines were seen on payment-6-api during the prod rehearsal. The Grails-2 legacy
// never hit this because _Cleaners.writeSimpleHealthcheck() overwrote
// conf/UrlMappings.groovy wholesale, dropping those handlers along with the views.
// Since Grails 6 keeps the real mapping file (it carries the api routes), prune just
// those lines: Spring Boot's BasicErrorController then answers the status codes in
// JSON, which is the right shape for an API anyway (boot-verified on the pruned tree:
// 404 -> application/json, zero stacktraces, /actuator/health and the api/2.0 403
// signature path unaffected). UrlMappingsSpec keeps asserting the handlers — it runs
// against the unpruned tree.
def removeStatusCodeMappings() {
    File mappings = project.file("grails-app/controllers/${PAYMENT_PKG}/UrlMappings.groovy")
    println "Removing status-code view mappings from ${mappings}"
    mappings.text = mappings.text.readLines()
            .findAll { !(it.trim() ==~ /^"\d{3}"\(view:\s*'.*'\)$/) }
            .join('\n') + '\n'
}

// api keep: only Api*/App*/SpringSecurityOAuth* controllers survive. The real
// UrlMappings.groovy (grails-app/controllers/com/khipu/payment/UrlMappings.groovy)
// is NOT a *Controller.groovy, so it SURVIVES — this is correct for Grails 6,
// where the api/2.0 + backend/api routes live in that file and map exactly the
// kept controllers. (Diverges from the Grails-2 legacy, which overwrote
// conf/UrlMappings.groovy with a healthcheck-only stub; in the consolidated
// Grails-6 mapping tree that would delete the api routes.) api uses actuator
// readiness — no /home/healthcheck stub.
// ⚠️ BOOT-TEST: confirm no surviving mapping points at a deleted controller
// (UrlMappings + mappings/AdminMappings + mappings/ExternalRedirectionMappings).
def removeNonApiWebFiles() {
    String keep = '.*(?:SpringSecurityOAuth|(?:Api|App)[^a-z0-9].*)Controller\\.groovy$'
    regexRemoveFile(CONTROLLERS_PKG_ROOT, java.util.regex.Pattern.compile(keep))
    removeDirectory 'grails-app/atmosphere/'
    removeFile 'grails-app/conf/AtmosphereMeteorConfig.groovy'
    removeDirectory 'grails-app/views/'
    removeDirectory 'grails-app/assets/'
    removeStatusCodeMappings()
}

// Consumer images (web stripped, HAVE consumers): minimal HomeController whose
// /home/healthcheck readiness triggers the deferred rabbit consumer startup
// (Story 5.17 contract). Grails-6 correct: SLF4J (not Grails-2 LogFactory).
def writeConsumerHealthcheck() {
    overwriteFile("grails-app/controllers/${PAYMENT_PKG}/UrlMappings.groovy", '''package com.khipu.payment

class UrlMappings {
\tstatic mappings = {
\t\t"/home/healthcheck"(controller: 'home', action: 'healthcheck')
\t}
}
''')
    overwriteFile("grails-app/controllers/${PAYMENT_PKG}/HomeController.groovy", '''package com.khipu.payment

import grails.core.GrailsApplication
import org.slf4j.LoggerFactory
import grails.plugin.springsecurity.annotation.Secured

class HomeController {
\tprivate static final appLogger = LoggerFactory.getLogger('appLogger')
\tstatic boolean appStarted = false

\tGrailsApplication grailsApplication
\tdef rabbitContext

\t// Mirrors the real HomeController.healthcheck — keep both in sync. `khipu.consumers.autoStart`
\t// lets a pod boot and be verified WITHOUT draining any queue, which is what the cutover needs:
\t// the migrated pods prove themselves while the legacy ones still own the queues. Defaults to
\t// true, so normal operation is unchanged.
\t@Secured(['permitAll'])
\tdef healthcheck() {
\t\tif (!appStarted) {
\t\t\tif (grailsApplication.config.getProperty('khipu.consumers.autoStart', Boolean, true)) {
\t\t\t\tappStarted = true
\t\t\t\trabbitContext.startConsumers()
\t\t\t\tappLogger.info 'Consumers started'
\t\t\t} else {
\t\t\t\tappLogger.warn 'Consumers NOT started - disabled by khipu.consumers.autoStart'
\t\t\t}
\t\t}
\t\trender text: 'working'
\t}
}
''')
}

// jobs (web stripped, NO consumers): no HomeController. Readiness via actuator
// (/actuator/health/readiness). A minimal empty UrlMappings keeps Grails happy
// after the controllers dir was nuked.
// ⚠️ BOOT-TEST: confirm jobs boots with empty mappings + actuator readiness.
def writeEmptyUrlMappings() {
    overwriteFile("grails-app/controllers/${PAYMENT_PKG}/UrlMappings.groovy", '''package com.khipu.payment

class UrlMappings {
\tstatic mappings = {
\t}
}
''')
}

// ---------------------------------------------------------------------------
// Consumer / job file removers (ported from _Cleaners.groovy)
// ---------------------------------------------------------------------------
def removeConsumersFiles(List<String> exclusionList) {
    println "Removing consumers with exclusionList: ${exclusionList}"
    removeFilesInFolder(CONSUMERS_DIR, exclusionList)
}

def removeBroadcastConsumer() { removeFile("${CONSUMERS_DIR}BroadcastConsumer.groovy") }
def removeIndexConsumer()     { removeFile("${CONSUMERS_DIR}IndexConsumer.groovy") }

def removeMetadataConsumers() {
    println "Removing metadata consumer files"
    new File(CONSUMERS_DIR)
            ?.listFiles()
            ?.findAll { it.name =~ /HandleMetadata.*Consumer\.groovy/ }
            ?.each { it.delete() }
}

def removeJobs(List<String> exclusionList) {
    println "Removing jobs with exclusionList: ${exclusionList}"
    removeFilesInFolder(JOBS_DIR, exclusionList)
}

def removeRabbitConfigFiles() {
    removeDirectory 'grails-app/rabbit-consumers/'
    removeDirectory 'grails-app/rabbit-converters/'
}

// ---------------------------------------------------------------------------
// maxMetadataConsumers — Grails 6: lives in application.yml (was Config.groovy).
// ---------------------------------------------------------------------------
def defineMaxMetadataConsumers(int max) {
    println "Setting maxMetadataConsumers = ${max} in ${APPLICATION_YML}"
    File yml = new File(APPLICATION_YML)
    yml.text = yml.text.replaceAll(/maxMetadataConsumers:\s*.*/, "maxMetadataConsumers: ${max}")
}

// ---------------------------------------------------------------------------
// Metadata sharding — generates HandleMetadata${index}Consumer.groovy for the
// shard's index range + the default consumer, then rewrites the exchange/queue
// block between the START/END markers in application.groovy (Grails 6: the
// block moved here from Config.groovy). Ported verbatim from
// PrepareMetadataConsumersVersion.generateHandleMetadataConsumers.
// ---------------------------------------------------------------------------
def generateHandleMetadataConsumers(int first, int total) {
    int lastIndex = first + total - 1
    println "Generating HandleMetadataConsumers ${first}..${lastIndex}"
    String tmpl = new File(METADATA_TMPL).text
    (first..lastIndex).each { index ->
        new File("${CONSUMERS_DIR}HandleMetadata${index}Consumer.groovy").write(tmpl.replace('${index}', "$index"))
    }
    new File("${CONSUMERS_DIR}HandleMetadataConsumer.groovy").write(new File(METADATA_TMPL_DEFAULT).text)

    println "Rewriting metadata declaration block in ${APPLICATION_GROOVY}"
    String replacement = """\t\t// START-HANDLE-METADATA-DECLARATION
\t\texchange name: 'handleMetadataExchange', type: 'topic', autoDelete: false, durable: true, {
\t\t\tqueue name: 'handleMetadataQueue', autoDelete: false, durable: true, exchange: 'handleMetadataExchange', binding: '#', arguments: ['x-queue-type': 'quorum', 'x-single-active-consumer': true]
\t\t}

\t\texchange name: 'handleMetadataExchangeDelayedRetry', type: 'topic', autoDelete: false, durable: true, {
\t\t\tqueue name: 'handleMetadataQueueDelayedRetry', autoDelete: false, durable: true, exchange: 'handleMetadataExchangeDelayedRetry', binding: '#', arguments: ['x-queue-type': 'quorum', 'x-dead-letter-exchange': 'handleMetadataExchange']
\t\t}
"""
    (first..lastIndex).each { id ->
        replacement += """
\t\texchange name: "handleMetadataExchange${id}", type: 'topic', autoDelete: false, durable: true, {
\t\t\tqueue name: "handleMetadataQueue${id}", autoDelete: false, durable: true, exchange: "handleMetadataExchange${id}", binding: '#', arguments: ['x-queue-type': 'quorum', 'x-single-active-consumer': true]
\t\t}
"""
    }
    replacement += '\t\t// END-HANDLE-METADATA-DECLARATION\n'

    File configFile = new File(APPLICATION_GROOVY)
    StringBuilder newText = new StringBuilder()
    boolean shouldOmit = false
    for (String line : configFile.text.readLines()) {
        if (line.trim() == '// START-HANDLE-METADATA-DECLARATION') { shouldOmit = true }
        if (line.trim() == '// END-HANDLE-METADATA-DECLARATION') {
            shouldOmit = false
            newText.append(replacement)
            continue
        }
        if (!shouldOmit) { newText.append(line).append('\n') }
    }
    configFile.text = newText.toString()
    println "Metadata consumers declared successfully"
}

// ===========================================================================
// TASKS — one per image type (metadata is parameterized, invoked 3× by the
// pipeline with first=0/10/20). Names mirror the legacy command names.
// ===========================================================================
String IMG_GROUP = 'khipu image prep'

tasks.register('prepareApiVersion') {
    group = IMG_GROUP
    description = 'Prune source tree for the api image (keeps Api*/App*/OAuth controllers + real UrlMappings; no consumers; KEEPS rabbit — publishes; KEEPS quartz — retains ResendFailedMessagesJob).'
    doLast {
        removeConsumersFiles([])
        removeNonApiWebFiles()
        removeJobs(['ResendFailedMessagesJob'])
        removeBroadcastConsumer()
        removeIndexConsumer()
        removeMetadataConsumers()
        // quartz RETAINED: ResendFailedMessagesJob (cron-triggered) is kept and needs it.
        removeDependencies([':atmosphere-meteor:', ':jquery:'])  // inert today (not in build.gradle) — documented intent
    }
}

tasks.register('prepareHttpVersion') {
    group = IMG_GROUP
    description = 'Prune source tree for the http image (keeps full web + BroadcastConsumer; KEEPS rabbit + real HomeController + quartz for ResendFailedMessagesJob + SseHeartbeatJob).'
    doLast {
        int max = (project.findProperty('maxMetadataConsumers') ?: '30') as int
        removeConsumersFiles(['BroadcastConsumer'])
        // SseHeartbeatJob (Story 11.5) MUST stay on the http image: SSE emitters live here (the image
        // browsers connect to, where BroadcastConsumer pushes), so the keep-alive job has to run here to
        // ping them. It is pruned from every other image (no emitters there → it would be a no-op).
        removeJobs(['ResendFailedMessagesJob', 'SseHeartbeatJob'])
        defineMaxMetadataConsumers(max)
        // legacy PrepareHttpVersion removed no dependencies; quartz RETAINED (ResendFailedMessagesJob + SseHeartbeatJob).
    }
}

tasks.register('prepareConsumersVersion') {
    group = IMG_GROUP
    description = 'Prune source tree for the consumers image (web stripped + generated healthcheck; keeps consumers except broadcast/index/metadata; KEEPS rabbit + quartz for ResendFailedMessagesJob).'
    doLast {
        stripWebLayer()
        writeConsumerHealthcheck()
        removeJobs(['ResendFailedMessagesJob'])
        removeBroadcastConsumer()
        removeIndexConsumer()
        removeMetadataConsumers()
        // quartz RETAINED: ResendFailedMessagesJob (cron-triggered) is kept and needs it.
        removeDependencies([':asset-pipeline:', ':atmosphere-meteor:', ':jquery:'])  // inert today — documented intent
    }
}

tasks.register('prepareIndexConsumerVersion') {
    group = IMG_GROUP
    description = 'Prune source tree for the payment-index-consumers image (web stripped + generated healthcheck; keeps only IndexConsumer; KEEPS rabbit + quartz for ResendFailedMessagesJob).'
    doLast {
        stripWebLayer()
        writeConsumerHealthcheck()
        removeJobs(['ResendFailedMessagesJob'])
        removeConsumersFiles(['IndexConsumer'])
        // quartz RETAINED: ResendFailedMessagesJob (cron-triggered) is kept and needs it.
        removeDependencies([':asset-pipeline:', ':atmosphere-meteor:', ':jquery:'])  // inert today — documented intent
    }
}

tasks.register('prepareJobsVersion') {
    group = IMG_GROUP
    description = 'Prune source tree for the jobs image (web + all rabbit consumers/converters stripped; KEEPS quartz; no HomeController — actuator readiness).'
    doLast {
        removeRabbitConfigFiles()
        stripWebLayer()
        writeEmptyUrlMappings()
        // jobs KEEPS quartz (it schedules every job). rabbit consumers removed via
        // removeRabbitConfigFiles; rabbit dep kept (jobs may publish).
        removeDependencies([':asset-pipeline:', ':atmosphere-meteor:', ':jquery:'])  // inert today — documented intent
    }
}

// Dev helper. Regenerates the committed dev-local HandleMetadata0Consumer.groovy snapshot
// from the template after the template is edited. NOT part of the image build — purely a
// developer convenience.
tasks.register('generateMetadataConsumersFile') {
    group = IMG_GROUP
    description = 'Dev helper: regenerate the committed HandleMetadata0Consumer.groovy snapshot from scripts/templates/HandleMetadataConsumer.groovy.tmpl.'
    doLast {
        new File("${CONSUMERS_DIR}HandleMetadata0Consumer.groovy").write(new File(METADATA_TMPL).text.replace('${index}', '0'))
        println "Regenerated ${CONSUMERS_DIR}HandleMetadata0Consumer.groovy from template"
    }
}

tasks.register('prepareMetadataConsumersVersion') {
    group = IMG_GROUP
    description = 'Prune source tree for a metadata-consumers shard. Params: -Pfirst -Pconsumers -PmaxMetadataConsumers. Generates HandleMetadata${index}Consumer for [first, first+consumers-1] + rewrites the application.groovy metadata block.'
    doLast {
        if (!project.hasProperty('first') || !project.hasProperty('consumers') || !project.hasProperty('maxMetadataConsumers')) {
            throw new GradleException('prepareMetadataConsumersVersion requires -Pfirst, -Pconsumers and -PmaxMetadataConsumers')
        }
        int first    = project.property('first') as int
        int consumers = project.property('consumers') as int
        int max      = project.property('maxMetadataConsumers') as int
        removeJobs([])
        removeConsumersFiles([])
        stripWebLayer()
        writeConsumerHealthcheck()
        defineMaxMetadataConsumers(max)
        // quartz PRUNED here only: metadata removes ALL jobs (removeJobs([])), so nothing needs it.
        removeDependencies([':asset-pipeline:', ':atmosphere-meteor:', ':jquery:', ':quartz:'])
        generateHandleMetadataConsumers(first, consumers)
    }
}
