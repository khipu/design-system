name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test -- --run --passWithNoTests

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

  # Specs of the Grails 6 taglibs (grails/taglibs-grails6). Nothing else runs them: before
  # this job, a failing taglib spec could be merged unnoticed. The module bundles the BeerCSS
  # output, so `npm run build` has to produce dist/beercss first.
  test-taglibs:
    name: Test Grails taglibs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - run: npm ci
      - run: npm run build

      - name: Run taglib specs
        working-directory: grails/taglibs-grails6
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taglibs-test-report
          path: grails/taglibs-grails6/build/reports/tests/test

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The action's default packages are "tools platform-tools"; the legacy "tools"
      # package no longer exists in the Android SDK and makes sdkmanager fail. The action
      # already installs cmdline-tools, and Gradle fetches the platform/build-tools it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - run: npm ci
      - run: npm run tokens:generate
      - run: npm run android:build